name: deploy-docs

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # npm's prebuild hook stages gopgql.wasm from the Go source above.
      - name: install and build docs
        run: |
          npm ci
          npm run build
        working-directory: docs

      # keep_files preserves the pr-preview/pr-<N>/ directories that
      # pr-preview.yml maintains on this same gh-pages branch; without it every
      # push to main replaces the branch wholesale and wipes all open previews.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          keep_files: true
