name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # Builds every binary, including cmd/gopgql-mcp — which the MCP
      # integration suite also compiles and spawns over stdio.
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: WASM build (playground compiles for js/wasm)
        run: GOOS=js GOARCH=wasm go build -o /tmp/gopgql.wasm ./cmd/wasm
      # The godog suites boot a real postgres:19beta2 container via
      # testcontainers-go and run SQL/PGQ GRAPH_TABLE queries against it. The
      # MCP suite (test/mcp) additionally drives a real MCP client against the
      # server, in-process and over stdio against the built binary.
      - name: integration tests (godog + testcontainers)
        run: go test -v -timeout 20m ./...

  # The shaping benchmark, run for one iteration per case (SPEC.md §7 → M8).
  #
  # It has a job of its own rather than a step in the one above: the test job is
  # capped at 25 minutes and already boots a container per suite, and if
  # something has to be thinned it must never be test/parity — that suite is the
  # milestone's acceptance criterion.
  #
  # One iteration proves the benchmark still compiles, still boots a container
  # and that both strategies still return a result. It asserts no timings: a
  # shared runner cannot hold them steady, and a flaky performance gate gets
  # switched off within a month. The numbers that *are* deterministic — the rows
  # each strategy ships — are asserted by ordinary tests in the same package,
  # which the job above already runs.
  bench:
    name: shaping benchmark (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: benchmark smoke run
        run: go test -run '^$' -bench . -benchtime 1x -timeout 20m ./test/bench/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
      - name: run golangci-lint
        run: golangci-lint run ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        run: govulncheck ./...

  docs:
    name: docs build & playground execution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: install docs deps
        run: npm ci
        working-directory: docs
      # npm's prebuild hook stages gopgql.wasm, so the site is never built
      # against a stale module. setup-go above is what makes that possible.
      # The postbuild hook runs scripts/check-lazy-runtime.mjs, which fails the
      # build if anything on the boot path can reach the PostgreSQL runtime.
      - name: build docs
        run: npm run build
        working-directory: docs

      # The browser suite is its own package with its own (unlocked, exactly
      # pinned) dependencies, so a deploy's `npm ci` in docs/ never installs a
      # browser driver it has no use for.
      - name: install the browser suite
        run: npm install --no-audit --no-fund
        working-directory: docs/e2e

      - name: install chromium
        run: npx playwright install --with-deps chromium
        working-directory: docs/e2e

      # This is where SQL/PGQ in a browser is actually proven: a real
      # GRAPH_TABLE query, on the pinned wasm build, in a Web Worker, served
      # from a preview-shaped subpath with no COOP/COEP headers.
      - name: playground execution suite
        run: npx playwright test
        working-directory: docs/e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            docs/e2e/playwright-report
            docs/e2e/test-results
          retention-days: 7

  release-config:
    name: goreleaser config & snapshot build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # install-only: the release itself runs in release.yml on a tag; here the
      # action is just the installer, so this job and the release job are
      # guaranteed to be the same goreleaser major.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true
      # A broken .goreleaser.yaml would otherwise only ever fail at release
      # time, when the tag is already pushed and the fix costs a retag.
      - name: goreleaser check
        run: goreleaser check
      # A snapshot proves the config actually builds every target. publish,
      # docker and announce are skipped so the job needs no registry
      # credentials, no QEMU and no buildx and stays fast on a PR; the real
      # multi-arch image build is exercised only on a tag, by release.yml.
      - name: goreleaser snapshot build
        run: goreleaser release --snapshot --clean --skip=publish,docker,announce
