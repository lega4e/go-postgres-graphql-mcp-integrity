name: release

# Releases are cut by pushing a semver tag; there is no manual dispatch. The
# pattern is explicit rather than a bare `v*` so that a stray tag like
# `v-wip` or `vendor-bump` cannot publish a release. The trailing `*` keeps
# prereleases (`v1.2.0-rc.1`) in scope — goreleaser marks those prerelease by
# itself from the tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# contents: write creates the GitHub Release and uploads the archives;
# packages: write pushes the images to ghcr.io. Nothing else is needed —
# goreleaser does not touch issues, pull requests or Pages.
permissions:
  contents: write
  packages: write

# Keyed on the tag, and deliberately NOT cancel-in-progress: a release that is
# half-way through uploading archives or pushing the multi-arch image should
# finish rather than be killed by a second run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: goreleaser (binaries + GHCR images)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 is required, not an optimisation: goreleaser derives the
      # version from the tag and the changelog from the commits since the
      # previous tag, and the default shallow clone has neither the history nor
      # the other tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # The image is multi-arch (linux/amd64 + linux/arm64), built by a single
      # `docker buildx build --platform=…` that goreleaser's `dockers_v2` block
      # drives. QEMU provides the emulation the arm64 layer needs, because
      # Dockerfile.release's `RUN apk add` executes on the *target* arch;
      # without both actions the arm64 half fails on this amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR accepts the workflow's own GITHUB_TOKEN, so publishing images needs
      # no PAT and no repository secret beyond what Actions already provides —
      # `packages: write` above is the whole grant.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The integration suite is deliberately NOT re-run here. It needs Docker
      # and a real postgres:19beta2 container, has no skip path (SPEC.md §10)
      # and takes up to 20 minutes. The gate is ci.yml being green on main
      # before the tag is pushed; re-running it at release time would double the
      # release's runtime while testing the same commit twice.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
