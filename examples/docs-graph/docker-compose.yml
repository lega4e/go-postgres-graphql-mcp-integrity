# Three containers and one on-demand one:
#
#   postgres  PostgreSQL 19 (SQL/PGQ), the only stateful piece.
#   init      runs `gopgql migrate` — SDL in, schema and property graph out.
#   seed      loads the example corpus once the schema exists.
#   mcp       the MCP server, over the streamable HTTP transport. It is a
#             long-running container like any other service, so several agents
#             can connect to one process — .mcp.json just points at the URL.
name: gopgql-docs-graph

x-dsn: &dsn postgres://gopgql:gopgql@postgres:5432/gopgql?sslmode=disable

services:
  postgres:
    image: postgres:19beta2
    environment:
      POSTGRES_DB: gopgql
      POSTGRES_USER: gopgql
      POSTGRES_PASSWORD: gopgql
    # Published on loopback only so you can point psql — or a locally built
    # gopgql-mcp — at the same database the server sees, without exposing an
    # example database with example credentials to the network.
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopgql -d gopgql"]
      interval: 2s
      timeout: 3s
      retries: 30

  init:
    build:
      context: ../..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOPGQL_DSN: *dsn
    volumes:
      - ./schema.graphql:/example/schema.graphql:ro
    # Both halves are generated into /tmp/migrations/{tables,graph} and applied
    # in order. An ephemeral --dir means they are regenerated every run; goose
    # skips the versions it has already applied, so this is a no-op on a
    # database that is already migrated.
    #
    # Tables must exist before the property graph that references them, and a
    # live graph blocks changes to the columns it exposes — gopgql sequences
    # both for you when it owns both halves.
    command: ["gopgql", "migrate", "--sdl", "/example/schema.graphql", "--dir", "/tmp/migrations"]

  seed:
    build:
      context: ../..
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      GOPGQL_DSN: *dsn
    volumes:
      - ./seed.sql:/example/seed.sql:ro
    # $$ escapes compose's own interpolation so the shell expands it.
    command: ["sh", "-c", "psql \"$$GOPGQL_DSN\" -v ON_ERROR_STOP=1 -q -f /example/seed.sql"]

  mcp:
    build:
      context: ../..
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      GOPGQL_DSN: *dsn
      GOPGQL_TRANSPORT: http
      GOPGQL_ADDR: ":8080"
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./schema.graphql:/example/schema.graphql:ro
    command: ["gopgql-mcp", "--sdl", "/example/schema.graphql"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
