# One database, three one-shot steps, and the server:
#
#   postgres  PostgreSQL 19 (SQL/PGQ), the only stateful piece.
#   generate  runs `gopgql generate` — one SDL in, TWO migration directories
#             out. It needs no database, which is why it does not wait for one.
#   migrate   applies those two directories, in lockstep by generation.
#   seed      loads the example corpus once the schema is fully applied.
#   mcp       the MCP server, over the streamable HTTP transport. It is a
#             long-running container like any other service, so several agents
#             can connect to one process — .mcp.json just points at the URL.
#
# generate and migrate are separate services on purpose: writing migrations and
# applying them are different jobs, and the schema and the property graph are
# different migrations. Running them as one step is what hides both facts.
name: gopgql-docs-graph

x-dsn: &dsn postgres://gopgql:gopgql@postgres:5432/gopgql?sslmode=disable

services:
  postgres:
    image: postgres:19beta2
    environment:
      POSTGRES_DB: gopgql
      POSTGRES_USER: gopgql
      POSTGRES_PASSWORD: gopgql
    # Published on loopback only so you can point psql — or a locally built
    # gopgql-mcp — at the same database the server sees, without exposing an
    # example database with example credentials to the network.
    ports:
      - "127.0.0.1:55432:5432"
    # -h 127.0.0.1 rather than the default unix socket: the postgres image runs
    # a temporary server on the socket alone while it initialises the data
    # directory, so a socket check goes green before anything is listening on
    # TCP — and the very next service then fails to connect.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopgql -d gopgql -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  generate:
    build:
      context: ../..
    volumes:
      - ./schema.graphql:/example/schema.graphql:ro
      - migrations:/migrations
    # One SDL, two migration histories:
    #
    #   /migrations/tables/  CREATE TABLE, CREATE INDEX
    #   /migrations/graph/   CREATE PROPERTY GRAPH
    #
    # The `ls` is the point of running this as its own service — the split is
    # something you can see in `docker compose logs generate`, not something a
    # comment claims.
    #
    # They land on a named volume rather than /tmp, so the history survives the
    # run: edit schema.graphql, bring the stack up again, and whichever half
    # actually changed gains a 0002 delta. `docker compose down -v` throws the
    # migrations away along with the database, which is how you start over.
    command: ["sh", "-c", "gopgql generate --sdl /example/schema.graphql --dir /migrations && echo && echo 'two migration histories, in the order they are applied:' && echo '/migrations/tables:' && ls -1 /migrations/tables && echo '/migrations/graph:' && ls -1 /migrations/graph"]

  migrate:
    build:
      context: ../..
    depends_on:
      postgres:
        condition: service_healthy
      generate:
        condition: service_completed_successfully
    environment:
      GOPGQL_DSN: *dsn
    # Read-only: applying migrations never writes them.
    volumes:
      - migrations:/migrations:ro
    # No --sdl. The migrations already exist; this step only applies them.
    #
    # The two halves go in in lockstep, one generation at a time —
    # tables/0001, graph/0001, tables/0002, graph/0002 — so every
    # CREATE PROPERTY GRAPH lands on the tables of its own generation, and a
    # live graph is taken down only when there is table work pending behind it.
    # `docker compose logs migrate` prints one line per half per version, so
    # the interleaving is visible rather than asserted.
    command: ["gopgql", "migrate", "--dir", "/migrations"]

  seed:
    build:
      context: ../..
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GOPGQL_DSN: *dsn
    volumes:
      - ./seed.sql:/example/seed.sql:ro
    # $$ escapes compose's own interpolation so the shell expands it.
    command: ["sh", "-c", "psql \"$$GOPGQL_DSN\" -v ON_ERROR_STOP=1 -q -f /example/seed.sql"]

  mcp:
    build:
      context: ../..
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      GOPGQL_DSN: *dsn
      GOPGQL_TRANSPORT: http
      GOPGQL_ADDR: ":8080"
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./schema.graphql:/example/schema.graphql:ro
    command: ["gopgql-mcp", "--sdl", "/example/schema.graphql"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

# The generated migrations, so the two histories outlive a single run.
volumes:
  migrations:
